services:
  - type: web
    name: daily-italy-app
    env: python
    region: frankfurt  # Frankfurt (EU) or Oregon (US) - both free
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m backend.scripts.seed_full_curriculum"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.1
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite:///./backend/data/italian_vocab.db"
    healthCheckPath: /api/health
    autoDeploy: true
